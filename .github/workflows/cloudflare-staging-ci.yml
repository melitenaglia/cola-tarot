name: Cloudflare staging CI
on:
  push:
    branches: [staging]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-staging-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: API regression smoke tests
        run: node --experimental-sqlite cloudflare/tests/smoke.mjs
